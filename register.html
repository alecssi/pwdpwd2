{% extends 'base.html' %}{% block title %}Register Patient{% endblock %}{% block body %}<section class="panel"><h2>Personal Information</h2>{% for error in errors %}<div class="notice error">{{ error }}</div>{% endfor %}{% if duplicate %}<div class="notice error">Record Already Exists. <a href="{{ url_for('patient',patient_id=duplicate.patient_id) }}">View Patient</a></div>{% endif %}<form method="post" class="form-grid"><label>First Name<input name="first_name" value="{{ form.get('first_name','') }}" required maxlength="50"></label><label>Last Name<input name="last_name" value="{{ form.get('last_name','') }}" required maxlength="50"></label><label>Birthdate<input type="date" name="birthdate" max="{{ today }}" value="{{ form.get('birthdate','') }}" required></label><label>Sex<select name="sex" required><option value="">Select Sex</option>{% for s in sexes %}<option {{ 'selected' if form.get('sex')==s else '' }}>{{ s }}</option>{% endfor %}</select></label><label>Category<select name="category" required><option value="">Select Category</option>{% for c in categories %}<option {{ 'selected' if form.get('category')==c else '' }}>{{ c }}</option>{% endfor %}</select></label><label>Contact Number<input name="contact" value="{{ form.get('contact','') }}"></label><label class="wide">Address<input name="address" maxlength="100" value="{{ form.get('address','') }}"></label><div class="wide"><button>Save Patient</button></div></form></section>{% endblock %}
